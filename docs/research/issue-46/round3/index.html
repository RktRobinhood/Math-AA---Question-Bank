const $=x=>document.getElementById(x), e=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOP=['All topics','Number and algebra','Functions','Geometry and trigonometry','Statistics and probability','Calculus'];
const S={
 q:{title:'Water jet',topic:'Functions',story:'A water jet rises above a paved courtyard.',model:'Quadratic height model',fields:[['a','a',-2],['b','b',12],['c','c',1],['T','End (s)',6]],
 src:'Time at maximum',srcShort:'Time',out:'seconds',target:'Height at maximum',ans:'3',targetAns:'19',sample:['2','17'],
 basePrompt:'Find the time at which the jet reaches its maximum height.',depPrompt:x=>'Using your answer to ('+x+'), find the height of the jet at that time.',indPrompt:'Find the maximum height of the jet.',
 formula:m=>'h(t) = '+m.a+'t² '+signed(m.b)+'t '+signed(m.c),require:m=>'Height h is in metres, t is in seconds and 0 ≤ t ≤ '+m.T+'.',altReason:'Enter a time strictly between the endpoints.',

 s:{title:'Theatre seating',topic:'Number and algebra',story:'A small theatre has several rows of seats. Each row has the same number of additional seats compared with the row in front.',model:'Arithmetic sequence model',fields:[['a','First row',20],['d','Increase',5],['n','Rows',8]],

 formula:m=>'uₖ = '+m.a+' + (k − 1) × '+m.d,require:m=>'There are '+m.n+' rows. The first row has '+m.a+' seats, with '+m.d+' more in each successive row.',altReason:'Enter a whole number larger than the first row. The resulting total must also be a whole number.',

};
function rational(n,d){if(d<0){n=-n;d=-d}let a=Math.abs(n), b=d;while(b){[a,b]=[b,a%b]}a=a||1;return d===a?String(n/a):String(n/a)+'/'+String(d/a)}

const parse=()=>{try{return JSON.parse(localStorage.getItem('studio-46-r3-2'))}catch{return null}};
function make(k){let c=S[k];return{blocks:['story','model','source','target'].map((kind,i)=>({kind,id:'b'+i,visible:true,x:i%2?53:4,y:i<2?24:315})),serial:4,edges:{b3:'b2'},m:Object.fromEntries(c.fields.map(f=>[f[0],String(f[2])])),story:c.story,note:{},test:c.sample.slice()}}
let saved=parse()||{}, app={q:saved.q||make('q'),s:saved.s||make('s')}, k=new URLSearchParams(location.search).get('example')==='s'?'s':'q', mode=new URLSearchParams(location.search).get('view')==='graph'?'graph':'stack',topic=S[k].topic,srcPort=null,changed='',dragState=null;
const st=()=>app[k], cfg=()=>S[k], by=(id)=>st().blocks.find(b=>b.id===id);
function persist(){try{localStorage.setItem('studio-46-r3-2',JSON.stringify(app))}catch{}}
function order(){const ids=st().blocks.filter(b=>b.visible&&['source','target','note'].includes(b.kind));return Object.fromEntries(ids.map((b,i)=>[b.id,String.fromCharCode(97+i)]))}
function label(b){return ({story:'Introduction',model:cfg().model,source:cfg().src,target:cfg().target,note:'Written response'})[b.kind]}
function values(){return Object.fromEntries(Object.entries(st().m).map(([key,value])=>[key,value.trim()===''?NaN:Number(value)]))}
function linked(b){return by(st().edges[b.id])}
function blockName(b,map){return map[b.id]?'('+map[b.id]+') '+label(b):b.visible?label(b):label(b)+' (hidden)'}
function usePrompt(b,map){const c=cfg();if(b.kind==='source')return c.basePrompt;if(b.kind==='target'){const s=linked(b);return s?c.depPrompt(map[s.id]||'missing part'):c.indPrompt}return st().note[b.id]||'State how your calculation supports your conclusion.'}
function constraints(){const s=st(),m=values(),calc=cfg().calc(m), map=order(), errs=[], warns=[];
 const hasMath=s.blocks.some(b=>b.visible&&['source','target'].includes(b.kind)), model=s.blocks.find(b=>b.kind==='model'), modelAt=s.blocks.indexOf(model);
 if(hasMath&&(!model||!model.visible))errs.push('Show or add the model before publishing. It supplies the student givens.');
 if((hasMath||model?.visible)&&calc.reason)errs.push(calc.reason);
 for(const [i,b] of s.blocks.entries()){
  if(!b.visible)continue;
  if(b.kind==='note')warns.push(s.note[b.id]?.trim()?'Teacher review: add a rubric for the written response.':'Add wording and review the written-response rubric.');
  if(['source','target'].includes(b.kind)&&model?.visible&&modelAt>i)errs.push('Place the model before '+blockName(b,map)+'.');
  if(b.kind==='target'&&s.edges[b.id]){
    const a=linked(b);
    if(!a||a.kind!=='source'||!a.visible)errs.push(blockName(b,map)+' needs its source part. Show it or remove the link.');
    else if(s.blocks.indexOf(a)>=i)errs.push(blockName(a,map)+' must print before '+blockName(b,map)+'.');
  }

function showLibrary(){
 const term=$('search').value.trim().toLowerCase(), c=cfg();
 $('topics').innerHTML=TOP.map(t=>'<button class="topic" data-topic="'+e(t)+'" aria-pressed="'+(topic===t)+'">'+e(t)+'</button>').join('');

function draw(){

  const nodeA=w.querySelector('[data-id="'+a+'"]'), nodeB=w.querySelector('[data-id="'+b+'"]');if(!nodeA||!nodeB)continue;
  const p=start(nodeA),q=start(nodeB);let x1,y1,x2,y2,d, rail=Math.max(p.x+p.w,q.x+q.w)+10;

  else if(q.x+q.w+13<p.x){x1=p.x;y1=p.y+p.h*.72;x2=q.x+q.w;y2=q.y+q.h*.72;let b=(x1+x2)/2;d='M'+x1+','+y1+' C'+b+','+y1+' '+b+','+y2+' '+x2+','+y2}
  else{x1=p.x+p.w;y1=p.y+p.h*.72;x2=q.x+q.w;y2=q.y+q.h*.72;d='M'+x1+','+y1+' H'+rail+' V'+y2+' H'+x2}
  const path=document.createElementNS(ns,'path');path.setAttribute('d',d);path.setAttribute('fill','none');path.setAttribute('stroke','currentColor');path.setAttribute('stroke-width','2');if(!by(a)?.visible||!by(b)?.visible)path.setAttribute('stroke-dasharray','5 4');svg.append(path);

}
function render(focus){const w=$('work'),q=constraints(), scroll=w.scrollTop;
 $('example').value=k; $('workTitle').textContent=mode==='stack'?'Paper stack':'Node canvas';
 $('workHint').textContent=mode==='stack'?'Block order is the paper order.':'Position cards freely. Arrows set paper order.';
 $('workNote').textContent=changed||(mode==='stack'?'Drag a library block or click +. Reorder with the grip or arrows.':'Drag blocks by their headers. Connect a purple output to an input.');
 for(const x of ['stack','graph'])$(x).setAttribute('aria-pressed',String(x===mode));
 $('blank').textContent=st().blankUndo?'Restore prior draft':'Start blank';
 w.className='work '+mode;w.innerHTML=st().blocks.map((b,i)=>card(b,i,q)).join('')||'<div class="empty"><strong>Drop the first block here</strong><p class="hint">Start with an introduction or the model. Click + in the library to add without dragging.</p></div>';
 w.scrollTop=scroll; showLibrary(); refresh();
 if(focus)w.querySelector(focus)?.focus({preventScroll:true});
}
function refresh(){const q=constraints(),c=cfg(),s=st(),m=q.m;
 const formula=document.querySelector('[data-formula]');if(formula)formula.textContent=Number.isFinite(Object.values(m).reduce((a,b)=>a+b,0))?c.formula(m):'Enter the model values';
 for(const p of document.querySelectorAll('[data-prompt]'))p.textContent=usePrompt(by(p.dataset.prompt),q.map);
 const checks=$('checks'),old=document.activeElement?.dataset?.trial; const selection=old!=null?[document.activeElement.selectionStart,document.activeElement.selectionEnd]:null;
 const visible=s.blocks.filter(b=>b.visible), math=visible.filter(b=>b.kind==='source'||b.kind==='target'), status=q.errs.length?'Blocked':q.warns.length?'Review':'Ready to review';
 const modeCalc=!q.errs.length&&!q.calc.reason;
 const key=modeCalc?math.map(b=>'<li>('+q.map[b.id]+') <strong>'+(b.kind==='source'?(q.calc.keyA??fmt(q.calc.x)):(q.calc.keyB??fmt(q.calc.y)))+'</strong> '+e(b.kind==='source'?q.calc.unitA:q.calc.unitB)+'</li>').join(''):'';
 const active=visible.find(b=>b.kind==='target'&&linked(b)?.visible&&s.blocks.indexOf(linked(b))<s.blocks.indexOf(b));
 let trial='';
 if(modeCalc&&active){
   const av=s.test[0].trim()===''?NaN:Number(s.test[0]),bv=s.test[1].trim()===''?NaN:Number(s.test[1]), zz=q.calc;
   const close=(x,y)=>Number.isFinite(x)&&Math.abs(x-y)<=1e-7;let verdict='';
   if(!Number.isFinite(av)||!Number.isFinite(bv))verdict='Enter both simulated answers.';
   else if(!zz.valid(av))verdict=c.altReason+' No follow-through check.';
   else if(close(av,zz.x)&&close(bv,zz.y))verdict='Matches the canonical key.';
   else if(close(bv,zz.y))verdict='B matches the canonical key independently.';
   else if(close(bv,zz.f(av)))verdict='Consistent follow-through: '+fmt(zz.f(av))+' '+zz.unitB+'. No marks assigned.';
   else verdict='Not consistent with the earlier answer. Expected '+fmt(zz.f(av))+' '+zz.unitB+' from the simulated input.';
   trial='<div class="check teacher"><h3>Follow-through test</h3><p class="hint">Simulated answers only. The key above does not change.</p><div class="fieldrow"><label class="label">Part ('+e(q.map[linked(active).id])+')<input inputmode="decimal" data-trial="0" value="'+e(s.test[0])+'"></label><label class="label">Part ('+e(q.map[active.id])+')<input inputmode="decimal" data-trial="1" value="'+e(s.test[1])+'"></label></div><p class="ink hint">'+e(verdict)+'</p></div>';
 }
 const paper=visible.map(b=>b.kind==='model'?'<p class="printPart math">'+e(c.require(m))+(k==='q'&&Object.values(m).every(Number.isFinite)?' '+e(c.formula(m))+'.':'')+'</p>':b.kind==='story'?'<p class="printPart">'+e(s.story)+'</p>':'<p class="printPart"><strong>('+q.map[b.id]+')</strong> '+e(usePrompt(b,q.map))+'</p>').join('');
 checks.innerHTML='<div class="check teacher"><span class="badge '+(q.errs.length?'bad':'')+'" role="status">'+status+'</span>'+q.errs.concat(q.warns).map(x=>'<p class="warn">'+e(x)+'</p>').join('')+'</div><div class="check"><h3 class="renderTitle">Student paper</h3>'+(q.errs.length?'<p class="hint">Preview blocked until the checks above are fixed.</p>':paper||'<p class="hint">No visible blocks.</p>')+'</div><div class="check teacher"><h3>Canonical answer key</h3>'+(key?'<ol>'+key+'</ol>':'<p class="hint">'+(q.errs.length?'Fix the authoring checks first.':'No computed answers yet.')+'</p>')+'</div>'+trial;
 if(old!=null){const t=checks.querySelector('[data-trial="'+old+'"]');if(t){t.focus({preventScroll:true});try{t.setSelectionRange(...selection)}catch{}}}
 requestAnimationFrame(draw);
}
function add(kind,place){const s=st(); if(kind!=='note'&&s.blocks.some(b=>b.kind===kind)){changed='That block is already on the workspace.';return render()}
 const count=s.blocks.length,id='b'+s.serial++,b={id,kind,visible:true,x:place?.x??(count%2?53:4),y:place?.y??(24+Math.floor(count/2)*285)};
 if(place?.before){const i=s.blocks.findIndex(x=>x.id===place.before);s.blocks.splice(Math.max(0,i),0,b)}else s.blocks.push(b);
 if(kind==='note')s.note[id]='Explain what the result means in context.';
 changed='Added '+label(b)+'.';persist();render('[data-hide="'+id+'"]');
 if(mode==='graph'&&!place&&innerWidth>620)$('work').scrollTop=Math.max(0,b.y-24);
}
function move(id,d,before){const s=st(),i=s.blocks.findIndex(x=>x.id===id);if(i<0)return;
 let j=before?s.blocks.findIndex(x=>x.id===before):i+d;if(j<0||j>=s.blocks.length||j===i)return;
 const b=s.blocks.splice(i,1)[0];if(before&&j>i)j--;s.blocks.splice(j,0,b);changed='Updated the paper order.';persist();render('[data-handle="'+id+'"]');
}
function link(t,a){const s=st(),b=by(t),p=by(a);if(!b||b.kind!=='target'||(a&&(!p||p.kind!=='source'||p.id===b.id))){changed='Choose a compatible source output first.';return render()}
 if(a)s.edges[t]=a;else delete s.edges[t];
 srcPort=null;changed=a?'Follow-through link connected.':'Follow-through link removed.';persist();render('[data-link="'+t+'"]');
}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.topic){topic=d.topic;showLibrary();return}
 if(d.add)return add(d.add);
 if(d.roll!==undefined){const v=st(); const sets=k==='q'?[[-2,12,1,6],[-3,10,4,3],[-1,8,5,8],[-4,24,2,6]]:[[20,5,8],[16,3,10],[18,4,9],[22,2,12]];const ref=cfg().fields;const current=sets.findIndex(arr=>arr.every((n,i)=>String(n)===v.m[ref[i][0]]));const next=sets[(current+1)%sets.length];v.m=Object.fromEntries(ref.map((f,i)=>[f[0],String(next[i])]));changed='Rerolled the model; paper and key updated.';persist();return render('[data-roll]')}
 if(d.hide){const x=by(d.hide);x.visible=!x.visible;changed=x.visible?'Restored '+label(x)+'.':'Hidden on paper. This block is still saved.';persist();return render('[data-hide="'+x.id+'"]')}
 if(d.move)return move(d.move,Number(d.by));
 if(d.out){srcPort=srcPort===d.out?null:d.out;changed=srcPort?'Output selected. Click the matching Input.':'';return render('[data-out="'+d.out+'"]')}
 if(d.in){if(!srcPort){changed='First choose an output, or pick a source from the input menu.';return render('[data-link="'+d.in+'"]')}return link(d.in,srcPort)}
 if(['graph','stack'].includes(b.id)){mode=b.id;changed='';srcPort=null;return render()}
 if(b.id==='blank'){const cur=st();if(cur.blankUndo){app[k]=cur.blankUndo;changed='Restored the prior draft.'}else{app[k]={...make(k),blocks:[],edges:{},blankUndo:JSON.parse(JSON.stringify(cur))};changed='Blank workspace. Your prior draft is saved.'}srcPort=null;persist();return render()}
 if(b.id==='reset'){app[k]=make(k);srcPort=null;changed='Example reset.';persist();return render()}
});
document.addEventListener('input',ev=>{const x=ev.target,d=x.dataset;
 if(x.id==='search')return showLibrary();
 if(d.m)st().m[d.m]=x.value;else if(d.text==='story')st().story=x.value;else if(d.text)st().note[d.text]=x.value;else if(d.trial!==undefined)st().test[d.trial]=x.value;else return;
 persist();refresh();
});
document.addEventListener('change',ev=>{const x=ev.target,d=x.dataset;if(d.link)return link(d.link,x.value);
 if(x.id==='example'){k=x.value;topic=cfg().topic;changed='';srcPort=null;$('search').value='';return render()}
 if(x.id==='theme'){document.documentElement.dataset.theme=x.value;try{localStorage.setItem('studio46-theme',x.value)}catch{}}
});
const work=$('work');
document.addEventListener('dragstart',ev=>{const x=ev.target.closest('[data-add],[data-handle]');if(!x)return;dragState=x.dataset.add?{kind:x.dataset.add}:{id:x.dataset.handle};ev.dataTransfer.setData('text/plain',JSON.stringify(dragState));ev.dataTransfer.effectAllowed='move'});
document.addEventListener('dragend',()=>{dragState=null});
work.addEventListener('dragover',e=>{if(dragState)e.preventDefault()});
work.addEventListener('drop',ev=>{if(!dragState)return;ev.preventDefault();const d=dragState;dragState=null;const over=ev.target.closest('.card')?.dataset.id,r=work.getBoundingClientRect();
 if(d.kind)return add(d.kind,mode==='graph'&&innerWidth>620?{x:Math.max(1,Math.min(53,100*(ev.clientX-r.left)/r.width-9)),y:Math.max(8,ev.clientY-r.top+work.scrollTop-18)}:{before:over});
 if(d.id&&over)return move(d.id,0,over);
 if(d.id&&!over)return move(d.id,st().blocks.length-1-st().blocks.indexOf(by(d.id)));
});
let ptr=null;
work.addEventListener('pointerdown',ev=>{if(mode!=='graph'||innerWidth<=620||!ev.target.closest('.cardHead')||ev.target.closest('button:not(.drag)')||ev.button!==0)return;
 const n=ev.target.closest('.card'),b=by(n.dataset.id);if(!b)return;ptr={n,b,x:b.x,y:b.y,ix:ev.clientX,iy:ev.clientY,id:ev.pointerId};try{n.setPointerCapture(ev.pointerId)}catch{}});
work.addEventListener('pointermove',ev=>{if(!ptr||ptr.id!==ev.pointerId)return;const r=work.getBoundingClientRect(), p=ptr;
 p.b.x=Math.max(1,Math.min(100-100*p.n.offsetWidth/r.width-1,p.x+100*(ev.clientX-p.ix)/r.width));p.b.y=Math.max(4,Math.min(1200,p.y+ev.clientY-p.iy));p.n.style.left=p.b.x+'%';p.n.style.top=p.b.y+'px';draw()});
for(const t of ['pointerup','pointercancel'])work.addEventListener(t,ev=>{if(ptr?.id===ev.pointerId){ptr=null;persist()}});
work.addEventListener('scroll',()=>requestAnimationFrame(draw));addEventListener('resize',()=>requestAnimationFrame(draw));
try{const t=localStorage.getItem('studio46-theme');if(['system','light','dark'].includes(t))document.documentElement.dataset.theme=$('theme').value=t}catch{}
render();
})();

</script></body></html>
