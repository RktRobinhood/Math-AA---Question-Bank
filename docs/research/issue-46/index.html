<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Question Builder · Three feasibility prototypes</title>
<style>
:root{color-scheme:light;--ink:#171428;--sub:#605c75;--line:#d7d5e2;--paper:#fff;--body:#eeedf3;--surface:#f8f7fb;--note:#eee8ff;--action:#5106d5;--action-text:#fff;--good:#075f4c;--good-soft:#e8f5ee;--warn:#7f3d05;--warn-soft:#fff1da;--font:Arial,Helvetica,sans-serif}
:root[data-theme=dark]{color-scheme:dark;--ink:#f3efff;--sub:#c4bbd7;--line:#484156;--body:#211b2b;--surface:#292137;--paper:#30273f;--note:#3a2b56;--action:#b89aff;--action-text:#21133e;--warn:#ffd794;--warn-soft:#472c1b;--good:#9be4c5;--good-soft:#16392e}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 var(--font);background:var(--body);color:var(--ink)}button,select,input{font:inherit}button,select{cursor:pointer}button{color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--action);outline-offset:3px}header{background:var(--paper);border-bottom:1px solid var(--line)}.top{max-width:1210px;margin:auto;padding:13px 25px;display:flex;align-items:center;gap:15px}.logo{font-size:16px;font-weight:800;letter-spacing:-.45px}.logo::before{content:"∑";margin-right:9px;color:var(--action);font:750 22px Georgia}.top .trail{font-size:14px;color:var(--sub);border-left:1px solid var(--line);padding-left:15px}.top select{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:7px 8px;font-size:13px}main{max-width:1210px;margin:auto;padding:30px 26px 34px}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.meta{font-size:12px;font-weight:750;color:var(--action)}h1{font-size:39px;letter-spacing:-1.65px;line-height:1.03;margin:7px 0 8px}.sub,.intro p{color:var(--sub)}.intro p{margin:0}.prototype{font-size:13px;color:var(--sub);text-align:right}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);margin-bottom:18px}.choices button{background:none;border:0;border-right:1px solid var(--line);padding:11px 15px;text-align:left;font-weight:725}.choices button:last-child{border:0}.choices button[aria-pressed=true]{color:var(--action);background:var(--note);box-shadow:inset 0 -3px var(--action)}.choices span{display:block;font-size:12px;color:var(--sub);font-weight:400;margin-top:2px}.choices b{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:6px;border-radius:4px;background:var(--body);font-size:13px}
.workspace{display:grid;grid-template-columns: minmax(275px,350px) minmax(0,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}.rail{padding:20px 20px 23px;border-right:1px solid var(--line);background:var(--paper);min-width:0}.meta2{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:750;color:var(--sub);margin-bottom:5px}.rail h2{font-size:22px;line-height:1.16;letter-spacing:-.55px;margin:6px 0 14px}.part{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.part input{width:18px;height:18px;accent-color:var(--action);margin:0 3px 0 0}.part small{display:block;color:var(--sub);font-size:12px}.part strong:last-child{font:700 13px/1.3 ui-monospace,monospace;color:var(--sub)}.info{margin:14px 0;padding:10px 11px;border-radius:5px;border-left:3px solid var(--action);background:var(--note);font-size:13px}.info p{margin:3px 0 0}.info.warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn)}.info.good{color:var(--good);background:var(--good-soft);border-color:var(--good)}.bar{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:14px}.bar strong{font:750 16px ui-monospace,monospace}.btn{border:1px solid var(--line);border-radius:5px;padding:9px 12px;background:var(--surface);font-size:13px;font-weight:700;min-height:40px}.btn.primary{background:var(--action);color:var(--action-text);border-color:var(--action)}.btn[disabled]{cursor:default;opacity:.52}.panel{min-width:0;padding:14px 26px 23px;background:var(--surface)}.papernav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 0 11px}.papernav strong{font-size:14px}.paper-tabs{display:flex;gap:4px}.paper-tabs button{border:1px solid transparent;background:transparent;color:var(--sub);border-radius:4px;padding:7px 9px;font-size:13px}.paper-tabs button[aria-pressed=true]{color:var(--action);border-color:var(--line);background:var(--paper);font-weight:700}.sheet{position:relative;background:#fff;color:#18141e;min-height:387px;padding:26px 32px 20px;border:1px solid #dbd9e1;box-shadow:0 2px 4px #0001;font:17px/1.45 Georgia,'Times New Roman',serif;}.sheet p{margin:0 0 14px}.print-head{font:700 13px/1.4 var(--font);color:#5e556f;border-bottom:1px solid #dbd9e1;padding-bottom:7px;margin-bottom:17px;display:flex;justify-content:space-between;gap:10px}.sheet strong{font-weight:700}.formula{text-align:center;font-size:22px;margin:12px 0 18px}.question{display:grid;grid-template-columns:29px 1fr 28px;gap:5px;padding:7px 0 8px}.qmark{text-align:right;white-space:nowrap}.answer-lines{border-bottom:1px dotted #a7a1b5;height:22px;margin:0 27px 5px 34px}.paper-note{font-size:12px;color:var(--sub);margin:9px 0 0}.raster{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff}.teacher-table{margin-top:12px;border-collapse:collapse;width:100%;font:14px/1.4 var(--font)}.teacher-table th,.teacher-table td{text-align:left;border-bottom:1px solid #dedde6;padding:9px 5px}.teacher-table th:last-child,.teacher-table td:last-child{text-align:right}.inputs{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0}.inputs label{display:block;font-size:13px;font-weight:700}.inputs select{margin-top:4px;border:1px solid var(--line);border-radius:5px;padding:8px;width:100%;background:var(--surface);color:var(--ink)}.inputs button{align-self:end}.answers{font-size:13px;margin-top:6px}.calcs{display:grid;grid-template-columns:1fr auto;gap:5px;border-bottom:1px solid var(--line);padding:5px 0}.pin{font-size:12px;color:var(--sub);margin:9px 0 0}.split-note{text-align:right;margin:11px 0 0;color:var(--sub);font-size:12px}.num{font:700 13px ui-monospace,monospace}
@media(max-width:820px){main{padding:20px 15px}.workspace{grid-template-columns:minmax(230px,290px) minmax(0,1fr)}.sheet{padding:19px}.panel{padding:12px 14px}.choices button{padding:10px}}
@media(max-width:620px){.top{padding:9px 13px;gap:10px}.top .trail{font-size:12px;padding-left:9px}.top select{padding:7px 4px}.logo{font-size:13px}.logo::before{margin-right:3px}.intro{display:block}.prototype{margin-top:9px;text-align:left}.intro p{font-size:14px}h1{font-size:32px}.choices span{display:none}.choices button{font-size:13px;min-height:50px;padding:5px 7px}.choices b{margin-right:3px;width:19px}.workspace{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line);padding:15px}.panel{padding:10px}.sheet{padding:15px;font-size:16px;min-height:320px}.question{grid-template-columns:23px 1fr 26px}.formula{font-size:19px}.paper-note{margin:8px 2px}.bar .btn{min-height:44px}}
@media print{header,.intro,.choices,.rail,.papernav,.paper-note,.split-note{display:none!important}body,main,.workspace,.panel{display:block;margin:0;padding:0;background:#fff;border:none}.sheet{border:none;box-shadow:none;color:#111;min-height:0;padding:.4in}}
</style></head><body>
<header><div class=top><span class=logo>IB Math Question Bank</span><span class=trail>Test Builder</span><select id=theme aria-label="Appearance"><option value=system>System</option><option value=light>Light</option><option value=dark>Dark</option></select></div></header>
<main>
<div class=intro><div><div class=meta>FEASIBILITY STUDY / ISSUE #46</div><h1>Choose what makes the paper.</h1><p>One original question. Three ways to edit it.</p></div><div class=prototype>Interactive mock-up · nothing is deployed</div></div>
<nav class=choices aria-label="Prototype options">
<button type=button data-mode=A><b>A</b>Image mask <span>Cover pixels, preserve the scan</span></button>
<button type=button data-mode=B><b>B</b>Editable parts <span>Reflow, relabel, check dependencies</span></button>
<button type=button data-mode=C><b>C</b>Question variants <span>Change a value and rebuild the key</span></button>
</nav>
<div class=workspace><aside class=rail id=rail aria-label="Teacher controls"></aside><section class=panel aria-label="Paper preview"><div class=papernav><strong id=previewTitle></strong><div class=paper-tabs aria-label="Preview type"><button id=student>Student paper</button><button id=key>Teacher key</button></div></div><div id=preview></div><p class=paper-note id=paperNote></p></section></div>
<div class=split-note>Demo problem and layouts are original. No IB exam material is reproduced.</div>
</main>
<script>
const id=s=>document.getElementById(s), q=(s)=>document.querySelectorAll(s);
const state={mode:new URLSearchParams(location.search).get('case')||'B',paper:'student',rasterHide:true,include:[true,false,true],rewrite:true,v:12,pinned:false};
if(!['A','B','C'].includes(state.mode))state.mode='B';
const values=[8,10,12,14]; const marks=[2,4,2];
function cssTheme(v){const k=v==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):v;document.documentElement.dataset.theme=k}
try{id('theme').value=localStorage.getItem('question46-theme')||'system'}catch{}
cssTheme(id('theme').value);id('theme').onchange=()=>{cssTheme(id('theme').value);try{localStorage.setItem('question46-theme',id('theme').value)}catch{}};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>cssTheme(id('theme').value));
function math(v){let t=v/4,first=v-1,h=1+v*v/8;return {t,first,h,d:h-first}}
function chip(s,i,desc,check,act){return '<label class=part><input type=checkbox '+(check?'checked':'')+' data-part="'+act+'"><span><b>'+s+'</b><small>'+desc+'</small></span><strong>['+marks[i]+']</strong></label>'}
function row(label,text,i){return '<div class=question><b>('+label+')</b><span>'+text+'</span><span class=qmark>['+marks[i]+']</span></div><div class=answer-lines></div>'}
function rail(title,stage,rows,info,end){return '<div class=meta2><span>'+stage+'</span><span>Q01</span></div><h2>'+title+'</h2>'+rows+info+end}
function info(label,text,style=''){return '<div class="info '+style+'"><b>'+label+'</b><p>'+text+'</p></div>'}
function shell(total,content,label='ORIGINAL SAMPLE'){return '<article class=sheet><div class=print-head><span>'+label+'</span><span>[Maximum mark: '+total+']</span></div>'+content+'</article>'}
function stem(v){return '<p>A fountain jet has height <i>h</i> metres at time <i>t</i> seconds, where 0 ≤ <i>t</i> ≤ 4.</p><div class=formula><i>h</i>(<i>t</i>) = −2<i>t</i><sup>2</sup> + '+v+'<i>t</i> + 1</div>'}
function keyTable(items){return '<table class=teacher-table><thead><tr><th>Part</th><th>Expected result / method</th><th>Marks</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>['+x[2]+']</td></tr>').join('')+'</tbody></table>'}
function raster(hide){
 const s='<svg xmlns="http://www.w3.org/2000/svg" width="770" height="466" viewBox="0 0 770 466"><rect width="770" height="466" fill="white"/><g fill="#16131f" font-family="Georgia,serif" font-size="20"><text x="36" y="50" font-family="Arial" font-weight="700" font-size="14">ORIGINAL SAMPLE   /   SIMULATED SCAN</text><text x="735" y="50" font-family="Arial" font-size="13" text-anchor="end">[Maximum mark: 8]</text><path d="M36,68H735" stroke="#dedbe4"/><text x="36" y="103">A fountain jet has height h metres at time t seconds, 0 ≤ t ≤ 4.</text><text x="257" y="146" font-style="italic" font-size="24">h(t) = −2t² + 8t + 1</text><text x="40" y="201">(a)</text><text x="83" y="201">Find the height at t = 1.</text><text x="718" y="201">[2]</text><path d="M83,235H700 M83,320H700 M83,410H700" stroke="#91889c" stroke-dasharray="2 4"/><text x="40" y="281">(b)</text><text x="83" y="281">Use differentiation to find the maximum height.</text><text x="718" y="281">[4]</text><text x="40" y="371">(c)</text><text x="83" y="371">How much higher is your answer to (b) than the height at t = 1?</text><text x="718" y="371">[2]</text></g></svg>';
 const svg=new Image();const canvas=id('raster');if(!canvas)return;svg.onload=()=>{const c=canvas.getContext('2d');c.drawImage(svg,0,0);if(hide){c.fillStyle='white';c.fillRect(30,252,723,75);}};svg.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)
}
function render(){
 q('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));
 id('student').setAttribute('aria-pressed',String(state.paper==='student'));id('key').setAttribute('aria-pressed',String(state.paper==='key'));
 id('previewTitle').textContent=state.paper==='student'?'Student paper · preview':'Teacher key · preview';
 let pr='',msg='',out='';
 if(state.mode==='A'){
  const masks=state.rasterHide;
  pr=rail('Cover part (b)','A · IMAGE MASK',chip('Height at 1 second',0,'Source (a)',true,'r0')+chip('Maximum by differentiation',1,'Source (b)',!masks,'r1')+chip('Compare heights',2,'Source (c); uses the result of (b)',true,'r2'),
  masks?info('A gap is not a rewrite','Part (c) still refers to (b). The scan also still says 8 marks. A crop can’t repair either.','warn'):info('The scan is intact','Try hiding (b) to see what a pixel overlay can and can’t change.'),'<div class=bar><span>Selected in basket</span><strong>'+(masks?4:8)+' marks</strong></div>');
  out=state.paper==='student'?'<canvas class=raster id=raster width=770 height=466 aria-label="Original example drawn to a raster. White overlay may mask part b."></canvas>':shell(8,'<p>The archived key is another image. The student-page mask does not update it.</p>'+keyTable([['(a)','7 m',2],['(b)','9 m at t=2',4],['(c)','2 m',2]]),'RATHER THAN AN UPDATED KEY');
  msg='Concept only. Protect the archive; do not offer public alteration of IB scans.';
 } else if(state.mode==='B'){
  let kept=state.include,blocked=kept[2]&&!kept[1]&&!state.rewrite,total=marks.reduce((n,v,i)=>n+(kept[i]?v:0),0),offset=0;
  const list=chip('Height at 1 second',0,'Stable part ID: height',kept[0],0)+chip('Maximum by differentiation',1,'Stable part ID: maximum',kept[1],1)+chip('Compare heights',2,state.rewrite&&!kept[1]?'Uses the self-contained alternative':'Depends on maximum',kept[2],2);
  let box=blocked?info('Fix one dependency','Keep the maximum part, or use the author-approved independent wording.','warn'):info('No broken references',state.rewrite&&!kept[1]&&kept[2]?'Part (c) becomes (b). The alternative gives two times directly and changes the assessed skill.':'The same selected parts feed the student paper and the teacher key.','good');
  let b='<div class=bar><strong>'+total+' marks</strong><button class="btn '+(blocked?'primary':'')+'" id=rewrite>'+ (state.rewrite?'Use original (c)':'Use independent (c)')+'</button></div>';
  pr=rail('Build from question parts','B · EDITABLE PARTS',list,box,b);
  let prompts=['Find the height of the jet at <i>t</i> = 1.','Use differentiation to find the maximum height of the jet.',state.rewrite&&!kept[1]?'How much higher is the jet at <i>t</i> = 2 than at <i>t</i> = 1?':'How much higher is the maximum height than the height at <i>t</i> = 1?'];
  out=shell(total,state.paper==='student'?stem(8)+prompts.map((x,i)=>kept[i]?row(String.fromCharCode(97+offset++),x,i):'').join(''):keyTable(['Substitute t=1 to get 7 m.','h′(t)=−4t+8; t=2 gives a maximum of 9 m.',state.rewrite&&!kept[1]?'Calculate h(2)−h(1) = 9−7 = 2 m.':'Difference: 9−7=2 m.'].map((v,i)=>kept[i]?['('+String.fromCharCode(97+offset++)+')',v,marks[i]]:null).filter(Boolean)));
  msg=blocked?'Draft only: there is still a dependency. Production export would be blocked.':'The student output shows only saved parts; the teacher key uses the same labels and total.';
 } else {
  let v=state.v,k=math(v); const options=values.map(v0=>'<option'+(v0===v?' selected':'')+'>'+v0+'</option>').join('');
  pr=rail('Change a safe parameter','C · QUESTION VARIANTS',
  '<div class=inputs><label>Linear coefficient <i>v</i><select id=coeff aria-label="Linear coefficient">'+options+'</select></label><button class=btn id=reroll>Reroll</button></div><div class=answers aria-label="Teacher-only recalculated results"><div class=calcs><b>At 1 second</b><span class=num>'+k.first+' m</span></div><div class=calcs><b>Maximum at '+k.t+' s</b><span class=num>'+k.h+' m</span></div><div class=calcs><b>Difference</b><span class=num>'+k.d+' m</span></div></div>',
  info('Teacher key updated','The stem and all three results come from the same valid parameter set.','good'),
  '<div class=bar><strong>8 marks</strong><button class="btn primary" id=pin>'+ (state.pinned?'Variant fixed ✓':'Fix this variant')+'</button></div><p class=pin>fountain-height v1 · '+(state.pinned?'paper fixed to v='+v:'demo instance v='+v)+'</p>');
  out=shell(8,state.paper==='student'?stem(v)+row('a','Find the height of the jet at <i>t</i> = 1.',0)+row('b','Use differentiation to find the maximum height of the jet.',1)+row('c','How much higher is the maximum height than the height at <i>t</i> = 1?',2):
  keyTable([['(a)','h(1) = '+k.first+' m',2],['(b)','h′(t) = −4t + '+v+'; t = '+k.t+' ⇒ '+k.h+' m',4],['(c)',k.h+' − '+k.first+' = '+k.d+' m',2]]));
  msg='This is one teacher-authored original, not an automatic rewrite of a scanned exam question.';
 }
 id('rail').innerHTML=pr;id('preview').innerHTML=out;id('paperNote').textContent=msg;
 if(state.mode==='A'){
  raster(state.rasterHide);
  q('[data-part]').forEach(b=>{if(b.dataset.part!=='r1')b.disabled=true;else b.onchange=()=>{state.rasterHide=!b.checked;render();document.querySelector('[data-part=r1]').focus()}});
 }
 if(state.mode==='B'){
  q('[data-part]').forEach(b=>{b.onchange=()=>{state.include[+b.dataset.part]=b.checked;const p=b.dataset.part;render();document.querySelector('[data-part="'+p+'"]').focus()}});
  id('rewrite').onclick=()=>{state.rewrite=!state.rewrite;render();id('rewrite').focus()};
 }
 if(state.mode==='C'){
  id('coeff').onchange=e=>{state.v=+e.target.value;state.pinned=false;render();id('coeff').focus()};
  id('reroll').onclick=()=>{const a=values.filter(v=>v!==state.v);state.v=a[(Math.random()*a.length)|0];state.pinned=false;render();id('reroll').focus()};
  id('pin').onclick=()=>{state.pinned=!state.pinned;render();id('pin').focus()};
 }
}
q('[data-mode]').forEach(e=>e.onclick=()=>{state.mode=e.dataset.mode;state.paper='student';render()});
id('student').onclick=()=>{state.paper='student';render()};id('key').onclick=()=>{state.paper='key';render()};render();
</script></body></html>
