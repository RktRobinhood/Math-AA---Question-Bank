<main class="ct12-main">
  <nav class="ct12-trail" aria-label="Calculator Skills"><a href="skills.html">Calculator Skills</a> / CT12</nav>
  <div data-calculator-watch></div>
  <section id="try-stage" class="ct12-try" aria-label="Work on the graph minimum" hidden>
    <div class="ct12-task">
      <p id="context" hidden></p>
      <h2 id="task">Find the minimum</h2>
      <p id="challenge"></p>
      <p id="try-instructions"></p>
    </div>
    <div class="ct12-try-device" id="try-device"></div>
    <div class="ct12-check">
      <p id="feedback" role="status" hidden></p>
      <p id="answer" role="status" hidden></p>
      <form id="answer-form">
        <div class="ct12-answer-row">
          <label><span id="answer-x-label">x-coordinate</span><input id="answer-x" type="text" inputmode="decimal" maxlength="22" autocomplete="off" required></label>
          <label><span id="answer-y-label">Minimum value</span><input id="answer-y" type="text" inputmode="decimal" maxlength="22" autocomplete="off" required></label>
          <button type="submit">Check</button>
        </div>
        <p id="check-feedback" role="status" hidden></p>
      </form>
      <p id="custom-task" hidden>Exploring a different function. Reset to return to the assigned question.</p>
      <button id="reset-try" type="button">Reset calculator</button>
    </div>
  </section>
  <div id="handheld-host" hidden>
    <div class="ct12-lcd" id="lcd" aria-label="Recreated TI-Nspire CX II-T Graphs screen" tabindex="-1">
      <canvas id="drawing" width="640" height="480" aria-hidden="true"></canvas>
      <div id="hotspots"></div><p id="lcd-text" class="ct12-sr"></p>
      <form id="expression-form" hidden>
        <label for="expression"><span aria-hidden="true">f₁(x)=</span><span class="ct12-sr">Graph function in x</span></label>
        <input id="expression" required maxlength="80" spellcheck="false" autocapitalize="off" autocomplete="off">
      </form>
    </div>
  </div>
  <div class="ct12-resources">
    <details id="watch-transcript"><summary>Transcript</summary><p id="transcript"></p></details>
    <a id="return-question" hidden>Back to the question bank ↗</a>
    <a href="graph-minimum.mp4">Earlier screen-only video</a>
  </div>
