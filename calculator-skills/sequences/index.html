<div data-calculator-watch></div>
<section class="seq-try" data-mode="try" id="stage" aria-label="Independent TI-Nspire CX II-T sequence practice" tabindex="0" hidden>
<div id="try-pane"><div class="try-bar"><button type="button" id="return">Return to Watch</button><button type="button" id="edit-inputs">Edit inputs</button></div><p id="taskline" class="try-task"></p></div>
<div class="stage-grid" id="try-grid">
<div id="handheld-host"><div id="lcd" class="screen" aria-label="Recreated TI-Nspire Calculator display">
<div class="lcd-status"><b>1.1</b><span>Calculator</span><i></i></div><div id="lcd-work"></div>

</div></div>
<div class="stage-side">

<aside id="try-side"><h2 id="try-title">Work on the calculator</h2><p id="key-hint" class="calc-hint"></p><p id="output" role="status" hidden></p><p id="link-status" class="error" role="status" hidden></p>
<div class="sequence-presets" id="presets" aria-label="Try another part of the same problem">
<button type="button" data-seq-part="total">First five days</button>
<button type="button" data-seq-part="one">Day 5</button>
<button type="button" data-seq-part="list">List alternate days</button>
<button type="button" data-seq-part="stepped">Total alternate days</button>
<button type="button" data-seq-part="threshold">First day at least 64</button>
</div>
<form id="fields" novalidate>
<label for="rule">Rule in <var>n</var></label><input id="rule" maxlength="100" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="e.g. 2*n+1">
<div class="form-grid"><label for="task">Output<select id="task"><option value="sum">Sum</option><option value="list">List of terms</option><option value="term">Nth term</option></select></label><label for="lower" id="lower-label">Lower index<input id="lower" maxlength="6" inputmode="numeric"></label><label for="upper"><span id="upper-label">Upper index</span><input id="upper" maxlength="6" inputmode="numeric"></label><label for="step" id="step-label">Step<input id="step" maxlength="6" inputmode="numeric"></label></div>
<div class="field-actions"><button id="load" type="submit">Load on calculator</button><button id="run" type="button" class="primary" hidden>Enter</button><button type="button" id="reset">Reset Try</button></div>
</form>
<form id="threshold-form" hidden novalidate>
<p id="threshold-instructions">Use the keypad, or use the day-number field above, to find the output on two consecutive days. Record the first qualifying day and both calculator values below.</p>
<label for="threshold-day">First day at or above 64 cartons</label>
<input id="threshold-day" inputmode="numeric" maxlength="2" autocomplete="off" aria-describedby="threshold-instructions" required>
<div class="form-grid"><label for="threshold-before">Previous day’s output (cartons)<input id="threshold-before" inputmode="numeric" maxlength="8" autocomplete="off" required></label>
<label for="threshold-current">That day’s output (cartons)<input id="threshold-current" inputmode="numeric" maxlength="8" autocomplete="off" required></label></div>
<div class="field-actions"><button type="submit">Check threshold</button></div>
<p id="threshold-feedback" role="status"></p>
</form>
<form id="answer-form" hidden novalidate><label for="answer" id="answer-label">Your answer</label><div class="answer-row"><input id="answer" maxlength="900" autocomplete="off" spellcheck="false"><button type="submit">Check answer</button></div><p id="feedback" role="status"></p></form>
</aside></div></div>
