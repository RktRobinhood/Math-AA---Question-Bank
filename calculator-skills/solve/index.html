<nav class="reg-trail" aria-label="Calculator Skills"><a href="../skills.html">Calculator Skills</a> / Numerical Solve</nav>
<div data-calculator-watch></div>
<section class="cx-handheld-stage solve-try" id="player" data-mode="try" aria-label="Independent Numerical Solve practice" tabindex="0" hidden>
<div id="try-grid">        <div class="lcd-group" id="handheld-host">
          <div class="device-label"><span>TI-Nspire CX II</span><span>CALCULATOR · RECREATED SCREEN</span></div>
          <div class="lcd" id="lcd" aria-label="Simulated TI-Nspire Calculator screen">
            <canvas id="drawing" width="640" height="480" aria-hidden="true"></canvas>
<p id="lcd-text" class="sr" aria-live="polite"></p>
            <div id="hotspots"></div>
            <form id="solver-form" class="solve-lcd-form" aria-label="Numerical Solve calculator entry" hidden novalidate>
              <p aria-hidden="true">Calculator · nSolve(</p>
              <label for="equation">Equation</label><input type="text" id="equation" required maxlength="100" autocomplete="off" spellcheck="false" autocapitalize="off">
              <label for="lower">Lower bound</label><input type="text" id="lower" inputmode="decimal" required maxlength="32" autocomplete="off">
              <label for="upper">Upper bound</label><input type="text" id="upper" inputmode="decimal" required maxlength="32" autocomplete="off">
            </form>
          </div>
        </div>
    <section class="practice" id="practice" aria-label="Calculator practice">
      <button type="button" id="return-watch">Return to Watch</button><div class="practice-head"><p id="try-task">Find where <strong>y = x²</strong> and <strong>y = 5</strong> meet. Use a different interval for each x-value.</p><button type="button" class="quiet" id="restart" hidden>Restart steps</button></div>
      <div class="case-row" id="case-row" aria-label="Practice presets">
        <button type="button" class="quiet" data-case="positive">Positive interval</button>
        <button type="button" class="quiet" data-case="negative">Negative interval</button>
      </div>
      <p id="try-tip" role="status"></p><div id="try-summary" class="try-summary" aria-live="polite"></div>
      <button type="button" class="quiet" id="edit-entry" hidden>Edit calculator entry</button>
      <p id="feedback" class="feedback" role="status" hidden></p>
      <p id="answer" class="answer" role="status" hidden></p>
    </section></div>
</section>
