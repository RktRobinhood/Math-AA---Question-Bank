<body data-base="../" data-nav="calculator-skills">
<div class="shell skills-shell">
  <aside class="side" id="skills-filters" aria-label="Filters">
    <div class="side-fixed">
      <div class="search">
        <input class="input" type="search" id="search" aria-label="Search skills" placeholder="Search calculator skills…">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <label class="skills-topic" for="topic"><span class="cap">Topic</span>
        <select class="select" id="topic"><option value="">All topics</option></select>
      </label>
    </div>
    <div class="sheet-foot"><button class="btn" id="filters-done" type="button">Show skills</button></div>
  </aside>
  <main class="main">
    <div class="rbar">
      <h1>Calculator Skills</h1>
      <span class="sp"></span>
      <button id="skills-filter-toggle" class="btn ghost filters-btn" type="button" aria-controls="skills-filters" aria-expanded="false">Filters</button>
      <div class="vt" role="group" aria-label="Layout">
        <button type="button" data-view="grid" title="Cards" aria-label="Cards" aria-pressed="true">▦</button>
        <button type="button" data-view="list" title="List" aria-label="List" aria-pressed="false">☰</button>
      </div>
      <a class="btn skills-open-calc" href="scratchpad/index.html?v=mathprint-1">Open calculator</a>
    </div>
    <section id="results" class="grid" aria-label="Matching skills"></section>
    <noscript><p class="hint">Turn on JavaScript to search and open the calculator lessons.</p></noscript>
  </main>
</div>
<div id="skills-scrim" class="sheet-scrim" aria-hidden="true"></div>
