<body data-base="../" data-nav="calculator-skills">
<div class="shell skills-shell">
  <aside class="side" id="skills-filters" aria-label="Filters">
    <div class="side-fixed">
      <div class="search">
        <input class="input" type="search" id="search" aria-label="Search skills" placeholder="Search calculator skills…">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <span class="cap" id="skills-topic-label">Topics</span>
    </div>
    <div class="tree skills-topics" id="skills-topics" role="group" aria-labelledby="skills-topic-label">
      <button class="skills-topic-all" type="button" data-skill-topic="" aria-controls="results" aria-pressed="true">All skills</button>
      <div class="trow"><button class="topen" type="button" data-skill-topic="1" aria-controls="results" aria-pressed="false"><span class="dot bg1" aria-hidden="true"></span><b aria-hidden="true">1</b> Numbers and algebra</button></div>
      <div class="trow"><button class="topen" type="button" data-skill-topic="2" aria-controls="results" aria-pressed="false"><span class="dot bg2" aria-hidden="true"></span><b aria-hidden="true">2</b> Functions</button></div>
      <div class="trow"><button class="topen" type="button" data-skill-topic="3" aria-controls="results" aria-pressed="false"><span class="dot bg3" aria-hidden="true"></span><b aria-hidden="true">3</b> Geometry and trig</button></div>
      <div class="trow"><button class="topen" type="button" data-skill-topic="4" aria-controls="results" aria-pressed="false"><span class="dot bg4" aria-hidden="true"></span><b aria-hidden="true">4</b> Statistics and probability</button></div>
      <div class="trow"><button class="topen" type="button" data-skill-topic="5" aria-controls="results" aria-pressed="false"><span class="dot bg5" aria-hidden="true"></span><b aria-hidden="true">5</b> Calculus</button></div>
      <div class="trow"><button class="topen" type="button" data-skill-topic="start" aria-controls="results" aria-pressed="false"><span class="dot bg-start" aria-hidden="true"></span> Getting started</button></div>
    </div>
    <div class="sheet-foot"><button class="btn" id="filters-done" type="button">Show skills</button></div>
  </aside>
  <main class="main">
    <div class="rbar">
      <h1>Calculator Skills</h1>
      <span class="sp"></span>
      <button id="skills-filter-toggle" class="btn ghost filters-btn" type="button" aria-controls="skills-filters" aria-expanded="false">Filters</button>
      <div class="vt" role="group" aria-label="Layout">
        <button type="button" data-view="grid" title="Cards" aria-label="Cards" aria-pressed="true">▦</button>
        <button type="button" data-view="list" title="List" aria-label="List" aria-pressed="false">☰</button>
      </div>
      <a class="btn skills-open-calc" href="scratchpad/index.html?v=mathprint-1">Open calculator</a>
    </div>
    <section id="results" class="grid" aria-label="Matching skills"></section>
    <noscript><p class="hint">Turn on JavaScript to search and open the calculator lessons.</p></noscript>
  </main>
</div>
<div id="skills-scrim" class="sheet-scrim" aria-hidden="true"></div>
</body>
</html>
